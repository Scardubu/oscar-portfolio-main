# CONVICTION ENGINE V1.0 — CI PIPELINE
# Major Reset • Lagos → Global • Production Conviction Architecture
# Runs on every push to main and every PR targeting main.
# Gates: type-check → lint → build → smoke tests (Playwright)

name: Conviction CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.24.0'

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type-check
        run: pnpm run type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.scardubu.dev

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          include-hidden-files: true
          retention-days: 1

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .next/

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests
        run: pnpm exec playwright test e2e/smoke.spec.ts --project=chromium
        env:
          CI: true
          NEXT_PUBLIC_SITE_URL: https://www.scardubu.dev

      - name: Smoke — font contract
        shell: bash
        run: |
          set -euo pipefail
          FONT_CONSTRUCTORS=$(grep -rEn '(Crimson_Pro|CrimsonPro|Geist|Inter|Space_Grotesk)[[:space:]]*\(' --include='*.tsx' --include='*.ts' app components lib 2>/dev/null || true)
          FONT_FAMILIES=$(grep -rEn 'font-family:[^;]*(Crimson Pro|Crimson_Pro|CrimsonPro|Geist|Inter|Space Grotesk)' --include='*.css' app components 2>/dev/null || true)
          if [ -n "$FONT_CONSTRUCTORS$FONT_FAMILIES" ]; then
            echo '✗ Forbidden font declaration detected:'
            printf '%s\n%s\n' "$FONT_CONSTRUCTORS" "$FONT_FAMILIES"
            exit 1
          fi
          echo '✓ Font contract passed'

      - name: Smoke — TypeScript safety contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "'@typescript-eslint/no-explicit-any': 'error'" eslint.config.mjs || {
            echo '✗ @typescript-eslint/no-explicit-any must remain an error';
            exit 1;
          }
          echo '✓ Explicit any remains blocked by the canonical ESLint gate'

      - name: Smoke — conviction strings present
        run: |
          grep -rEn "The system has to work at 2am" --include="*.tsx" --include="*.ts" . | grep -q "." || (echo "✗ Conviction signal missing" && exit 1)
          grep -rEn "STAFF\+ / PRINCIPAL" --include="*.tsx" . | grep -q "." || (echo "✗ Badge string missing" && exit 1)
          echo "✓ Conviction strings verified"

      - name: Smoke — V16 V17 V18 V19 contract checks
        run: |
          V16_A=$(grep -rEn "translateZ\(0\)" --include="*.css" --include="*.tsx" app components | wc -l)
          V16_B=$(grep -rEn "contain:[[:space:]]*strict" --include="*.css" --include="*.tsx" app components | wc -l)
          [ "$V16_A" -ge 1 ] && [ "$V16_B" -ge 1 ] || (echo "✗ V16 GradientMesh safeguards missing" && exit 1)

          V17=$(grep -rEn 'name="color-scheme"[[:space:]]+content="dark"' --include="*.tsx" app | wc -l)
          [ "$V17" -ge 1 ] || (echo "✗ V17 color-scheme meta missing" && exit 1)

          V18=$(grep -rEn 'aria-live="polite"' --include="*.tsx" components | grep -i "liveactivitybar\|ticker\|commit\|status" | wc -l)
          [ "$V18" -ge 1 ] || (echo "✗ V18 aria-live missing" && exit 1)

          V19=$(grep -rEn 'min-h-\[44px\]|min-w-\[44px\]' --include="*.tsx" components | grep -i "bookmark\|toast\|dismiss" | wc -l)
          [ "$V19" -ge 1 ] || (echo "✗ V19 touch target missing" && exit 1)

      - name: Smoke — V22 z-index multi-digit regex support
        run: |
          Z_MAGIC=$(grep -rEn "z-index: [0-9]+|zIndex: [0-9]+" --include="*.tsx" --include="*.ts" --include="*.css" components app lib | grep -v "constants/z-index.ts" | wc -l)
          echo "Z-index multi-digit scan executed; matches=$Z_MAGIC"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
