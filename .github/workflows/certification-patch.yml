name: Certification Patch Runner

on:
  push:
    branches:
      - refine/portfolio-responsive-positioning-20260821
    paths:
      - .github/workflows/certification-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(ci): add one-shot certification patch runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/portfolio-responsive-positioning-20260821
          fetch-depth: 0

      - name: Apply exact certification patches
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'app/fixes.css',
              """  .hero-body-text,\n  #hero p,\n  #section-projects p,\n  #section-about p {\n""",
              """  .hero-body-text,\n  #section-projects p,\n  #section-about p {\n""",
          )

          replace_exact(
              'tests/portfolio.spec.ts',
              """  test('hero bio contains reliability-first positioning', async ({ page }) => {\n    await expect(\n      page.getByText(/Reliability-first AI, financial, and platform systems/i)\n    ).toBeVisible();\n  });\n""",
              """  test('hero bio contains reliability-first positioning', async ({ page }) => {\n    const hero = page.locator('section#hero[aria-labelledby=\"hero-title\"]');\n    await expect(hero.locator('p.hero-body-text')).toContainText(\n      /Reliability-first AI, financial, and platform systems/i\n    );\n  });\n""",
          )

      - name: Commit responsive fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/fixes.css
          git commit -m 'fix(responsive): isolate identity card typography'

      - name: Commit selector fix
        run: |
          git add tests/portfolio.spec.ts
          git commit -m 'test(hero): scope positioning assertion'

      - name: Push focused commits
        run: git push origin HEAD:refine/portfolio-responsive-positioning-20260821
