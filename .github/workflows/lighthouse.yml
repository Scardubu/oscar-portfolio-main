# Lighthouse CI - PRD Phase 8.2
name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SITE_URL: https://scardubu.dev

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: false
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results-${{ github.run_id }}
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7

      - name: Comment PR with Lighthouse results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifestPath = '.lighthouseci/manifest.json';
            if (!fs.existsSync(manifestPath)) {
              core.warning('Lighthouse manifest was not generated; skipping score comment.');
              return;
            }

            const results = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const summary = results[0];
            if (!summary?.summary) {
              core.warning('Lighthouse manifest did not contain a summary; skipping score comment.');
              return;
            }

            const comment = `## Lighthouse CI Results

            | Category | Score |
            |----------|-------|
            | Performance | ${Math.round(summary.summary.performance * 100)} |
            | Accessibility | ${Math.round(summary.summary.accessibility * 100)} |
            | Best Practices | ${Math.round(summary.summary['best-practices'] * 100)} |
            | SEO | ${Math.round(summary.summary.seo * 100)} |

            [View full report](${summary.url})
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
