project_name: 'oscar-portfolio'

languages:
  - typescript
  - markdown
  - yaml

encoding: 'utf-8'
ignore_all_files_in_gitignore: true

ignored_paths:
  - node_modules
  - dist
  - build
  - .next

read_only: false

excluded_tools: []
included_optional_tools: []
fixed_tools: []

default_modes:
  - editing

initial_prompt: |
  You are working on a personal portfolio website.
  Focus on aesthetics, performance, SEO, and clean UI/UX.
  Optimize loading speed, animations, and accessibility.

symbol_info_budget: 4.0

line_ending: native
